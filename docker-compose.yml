services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: local/extractify-backend:latest
    pull_policy: never       # ⬅️ prevents any registry pull
    environment:
      - DOCTR_CACHE_DIR=/app/models/doctr
    volumes:
      - ./models:/app/models:ro
      - ./data:/app/data
    expose:
      - "8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./extractify-react
      dockerfile: Dockerfile.frontend
    image: local/extractify-frontend:latest
    pull_policy: never       # ⬅️ prevents any registry pull
    ports:
      - "8080:80"
    depends_on:
      - backend
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
